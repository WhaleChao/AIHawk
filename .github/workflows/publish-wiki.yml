# Publishes docs/wiki/ to the GitHub wiki of this repository on every push to main that changes it.
#
# The wiki is its own git repository (<repo>.wiki.git): flat pages, no front matter, a _Sidebar.md. The render is
# invisible_playwright_mcp's own (scripts/build_wiki.py and scripts/sync_article_pixels.py, MIT, fetched at a fixed
# commit rather than copied): it strips the front matter, rewrites [x](page.md) links to the wiki's form, names
# index.md Home, builds the sidebar from parent/nav_order, and gives every page its view pixel (a release asset of
# the `article-views` release, created on first use). The wiki checkout is emptied of pages before the copy, so a
# page deleted from docs/wiki/ leaves the wiki too.
name: publish-wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

env:
  # invisible_playwright_mcp's main on 2026-10-09: the converter this wiki is rendered with.
  CONVERTER_REPO: feder-cr/invisible_playwright_mcp
  CONVERTER_REF: b72e8b1937771149ed06b2ba73ccb9cb32a687f8

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the converter
        run: |
          set -euo pipefail
          mkdir -p wiki_tools
          for script in build_wiki.py sync_article_pixels.py; do
            curl -fsSL -o "wiki_tools/$script" \
              "https://raw.githubusercontent.com/${CONVERTER_REPO}/${CONVERTER_REF}/scripts/$script"
          done

      - name: Render docs/wiki/ into wiki pages
        run: python wiki_tools/build_wiki.py docs/wiki wiki_build --pixels "${{ github.repository }}"

      # Upload before the push: a page published without its asset counts nothing until the next run.
      - name: Give every new page its view pixel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wiki_tools/sync_article_pixels.py --repo "${{ github.repository }}" wiki_build

      - name: Check every page carries its own pixel
        run: |
          python wiki_tools/sync_article_pixels.py --selftest
          python wiki_tools/sync_article_pixels.py --repo "${{ github.repository }}" --check wiki_build

      - name: Publish to the wiki
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_TOKEN != '' && secrets.WIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          git clone "https://x-access-token:${WIKI_PUSH_TOKEN}@github.com/${repo}.wiki.git" wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          cp wiki_build/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
          else
            git commit -m "docs: sync wiki from docs/wiki (${{ github.ref_name }})"
            git push origin HEAD:master
          fi
